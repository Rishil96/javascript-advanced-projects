<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://kit.fontawesome.com/1935d064dd.js"
      crossorigin="anonymous"
    ></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    
    <div class="container">
      <div class="row box">
        <div class="col-md-6">
          <div class="form-container">
            <div class="text-center">
              <h2>Multi-Step Form</h2>
              <span>Fill the form fields below</span>
            </div>
            <form action="" onsubmit="return false" autocomplete="off">
              <div class="steps">
                <p class="step">1</p>
                <p class="step">2</p>
                <p class="step">3</p>
                <p class="step">4</p>
              </div>

              <div class="form-item">
                <label for="" class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="John">
                <label for="" class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Doe">
              </div>

              <div class="form-item">
                <label for="" class="form-label">Age</label>
                <input type="number" class="form-control">
                <label for="" class="form-label">Gender</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-item">
                <label for="" class="form-label">Education</label>
                <input type="text" class="form-control">
                <label for="" class="form-label">Address</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-item">
                <label for="" class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="john@example.com">
                <label for="" class="form-label">Password</label>
                <input type="password" class="form-control">
              </div>


              <button class="btn btn-primary btn-lg">Previous</button>
              <button class="btn btn-primary btn-lg">Next</button>
              <!-- <button class="btn btn-primary btn-lg">Submit</button> -->
            </form>
          </div>
        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="script.js"></script>
  </body>
</html>
